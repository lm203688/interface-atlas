[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-atlas"
version = "1.2.0"
description = "非药物接口层：物理信号接收器图谱 + 证据剂量图谱"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.0", "matplotlib>=3.7", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
interface-atlas = "interface_atlas.cli:main"

[tool.setuptools]
packages = ["interface_atlas"]
